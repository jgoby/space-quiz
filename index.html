<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ff">
  <title>Orbit Quiz — Space Explorer</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --page: #f5f4ff;
      --surface: #fff;
      --surface-soft: #f7f6fc;
      --ink: #211d39;
      --muted: #77738d;
      --line: #e9e6f3;
      --accent: #7356e8;
      --accent-dark: #5b3fcf;
      --accent-soft: #eeeaff;
      --green: #178a5b;
      --green-bg: #e6f8ef;
      --red: #c53b54;
      --red-bg: #fff0f1;
      --shadow: 0 24px 70px rgb(52 37 108 / 10%), 0 3px 12px rgb(52 37 108 / 5%);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #12111b;
        --surface: #1d1b29;
        --surface-soft: #252332;
        --ink: #f2efff;
        --muted: #aaa5bd;
        --line: #363346;
        --accent: #a38bff;
        --accent-dark: #b6a4ff;
        --accent-soft: #322c4b;
        --green: #67d7a0;
        --green-bg: #1c3c31;
        --red: #ff8291;
        --red-bg: #462831;
        --shadow: 0 24px 70px rgb(0 0 0 / 30%), 0 3px 12px rgb(0 0 0 / 15%);
      }
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      display: grid;
      place-items: center;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 0%, rgb(151 125 255 / 13%), transparent 48%),
        var(--page);
      font-size: 15px;
      line-height: 1.5;
    }

    button { font: inherit; }

    .quiz { width: min(100%, 560px); }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 18px;
      letter-spacing: 0;
    }

    .card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-top { padding: 26px 30px 0; }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        linear-gradient(115deg, color-mix(in srgb, var(--accent) 8%, var(--surface)), var(--surface-soft));
    }

    .score-pill {
      display: grid;
      grid-template-columns: auto auto;
      align-items: center;
      column-gap: 8px;
      padding: 4px 10px 4px 8px;
      border-left: 1px solid var(--line);
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .score-icon {
      grid-row: span 2;
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
      border-radius: 9px;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      font-size: 15px;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .12em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .mission-readout {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-light {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #35c98a;
      box-shadow: 0 0 0 3px rgb(53 201 138 / 13%), 0 0 9px rgb(53 201 138 / 55%);
      animation: beacon 2.4s ease-in-out infinite;
    }

    .mission-step {
      display: block;
      margin-top: 3px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 20px;
      font-weight: 750;
      letter-spacing: .04em;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .mission-step-total {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .score-value {
      display: block;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 18px;
      font-weight: 750;
      line-height: 1.1;
    }

    .score-unit {
      margin-left: 3px;
      color: var(--muted);
      font-family: inherit;
      font-size: 10px;
      font-weight: 650;
    }

    .progress-track {
      position: relative;
      height: 8px;
      overflow: hidden;
      border-radius: 999px;
      background:
        repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 10%),
        var(--surface-soft);
      box-shadow: inset 0 1px 2px rgb(20 16 40 / 8%);
    }

    .progress-bar {
      width: 10%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #8264f4, #c17aef);
      transition: width 450ms cubic-bezier(.2,.8,.2,1);
    }

    .content { padding: 30px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 29px);
      line-height: 1.23;
      letter-spacing: -.035em;
    }

    .subtitle {
      margin: 9px 0 24px;
      color: var(--muted);
      font-size: 14px;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 57px;
      align-items: center;
      gap: 13px;
      padding: 10px 15px;
      border: 1.5px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--surface);
      text-align: left;
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .answer:hover:not(:disabled) {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .answer:focus-visible, .primary:focus-visible, .secondary:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 3px;
    }

    .answer-key {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border-radius: 9px;
      color: var(--muted);
      background: var(--surface-soft);
      font-size: 12px;
      font-weight: 750;
    }

    .answer-text { flex: 1; font-size: 15px; font-weight: 560; }

    .answer.selected {
      border-color: var(--accent);
      background: var(--accent-soft);
    }
    .answer.selected .answer-key { color: #fff; background: var(--accent); }
    .answer.correct {
      border-color: var(--green);
      background: var(--green-bg);
      animation: pop 420ms ease both;
    }
    .answer.correct .answer-key { color: #fff; background: var(--green); }
    .answer.wrong {
      border-color: var(--red);
      background: var(--red-bg);
      animation: shake 400ms ease both;
    }
    .answer.wrong .answer-key { color: #fff; background: var(--red); }
    .answer:disabled { cursor: default; }

    .feedback {
      min-height: 28px;
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }
    .feedback.is-correct { color: var(--green); }
    .feedback.is-wrong { color: var(--red); }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
    }

    .hint { color: var(--muted); font-size: 12px; }

    .primary, .secondary {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 19px;
      border: 0;
      border-radius: 13px;
      font-weight: 720;
      cursor: pointer;
      transition: transform 150ms ease, background 150ms ease, opacity 150ms ease;
    }

    .primary {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 7px 16px rgb(115 86 232 / 24%);
    }
    .primary:hover:not(:disabled) { transform: translateY(-1px); background: var(--accent-dark); }
    .primary:disabled { opacity: .48; cursor: not-allowed; box-shadow: none; }
    .secondary { color: var(--ink); background: var(--surface-soft); }
    .secondary:hover { background: var(--accent-soft); }

    .results {
      padding: 43px 34px 38px;
      text-align: center;
      animation: arrive 500ms ease both;
    }
    .result-emoji {
      display: grid;
      width: 92px;
      height: 92px;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 28px;
      background: var(--accent-soft);
      font-size: 48px;
      animation: float 3s ease-in-out infinite;
    }
    .results h1 { font-size: 31px; }
    .results-copy { max-width: 360px; margin: 11px auto 23px; color: var(--muted); }
    .result-duration { margin: 0 0 20px; color: var(--muted); }
    .result-duration strong { color: var(--ink); }
    .results-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .copy-status { min-height: 20px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    .result-score {
      display: inline-flex;
      align-items: baseline;
      gap: 7px;
      margin-bottom: 25px;
      color: var(--accent);
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -.04em;
    }
    .result-score small { color: var(--muted); font-size: 15px; font-weight: 600; letter-spacing: 0; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes shake {
      15%, 55%, 85% { transform: translateX(-6px); }
      35%, 70% { transform: translateX(6px); }
      100% { transform: translateX(0); }
    }
    @keyframes pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    @keyframes beacon {
      0%, 100% { opacity: 1; }
      50% { opacity: .55; }
    }

    @media (max-width: 520px) {
      body { padding: 28px 14px; }
      .card { border-radius: 20px; }
      .card-top { padding: 22px 20px 0; }
      .content { padding: 25px 20px 22px; }
      .answer { min-height: 54px; padding: 9px 12px; }
      .hint { max-width: 125px; }
      .results { padding: 37px 20px 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="quiz">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span> Cosmos Club</div>
    <section class="card" aria-label="Space exploration quiz">
      <div id="quiz-view">
        <div class="card-top">
          <div class="stats">
            <div>
              <span class="stat-label mission-readout"><span class="status-light" aria-hidden="true"></span>Mission control · active</span>
              <span class="mission-step"><span id="question-count">01</span><span class="mission-step-total"> / 10</span></span>
            </div>
            <span class="score-pill">
              <span class="score-icon" aria-hidden="true">✦</span>
              <span><span class="stat-label">Mission score</span><span class="score-value"><span id="score">0</span><span class="score-unit">PTS</span></span></span>
            </span>
          </div>
          <div
            class="progress-track"
            role="progressbar"
            aria-label="Quiz progress"
            aria-valuemin="0"
            aria-valuemax="10"
            aria-valuenow="0"
          >
            <div class="progress-bar" id="progress-bar"></div>
          </div>
        </div>
        <div class="content">
          <p class="eyebrow">Mission briefing</p>
          <h1 id="question" tabindex="-1"></h1>
          <p class="subtitle">Choose the best answer to continue your journey.</p>
          <div class="answers" id="answers" role="group" aria-labelledby="question"></div>
          <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
          <div class="actions">
            <span class="hint" id="hint">A little curiosity goes a long way.</span>
            <button class="primary" id="next-button" type="button" disabled>
              Check answer <span aria-hidden="true">→</span>
            </button>
          </div>
        </div>
      </div>
      <div id="results-view" hidden></div>
    </section>
  </main>

  <script>
    const questions = [
      {
        question: "Which planet is known as the Red Planet?",
        answers: ["Venus", "Mars", "Jupiter", "Mercury"],
        correct: 1,
        fact: "Mars looks red because its soil is rich in rusty iron minerals."
      },
      {
        question: "What is the name of the galaxy we call home?",
        answers: ["Andromeda", "Whirlpool Galaxy", "Milky Way", "Sombrero Galaxy"],
        correct: 2,
        fact: "Our solar system lives in the Milky Way's Orion Arm."
      },
      {
        question: "Which was the first human-made object to reach space?",
        answers: ["Sputnik 1", "V-2 rocket", "Explorer 1", "Apollo 11"],
        correct: 1,
        fact: "A German V-2 rocket crossed the 100 km Kármán line in 1944."
      },
      {
        question: "What is the largest planet in our solar system?",
        answers: ["Saturn", "Neptune", "Earth", "Jupiter"],
        correct: 3,
        fact: "Jupiter is so large that more than 1,300 Earths could fit inside it."
      },
      {
        question: "Who was the first person to walk on the Moon?",
        answers: ["Buzz Aldrin", "Yuri Gagarin", "Neil Armstrong", "John Glenn"],
        correct: 2,
        fact: "Neil Armstrong stepped onto the lunar surface on July 20, 1969."
      },
      {
        question: "Which planet has the most prominent ring system?",
        answers: ["Saturn", "Uranus", "Jupiter", "Neptune"],
        correct: 0,
        fact: "Saturn's rings are made mostly of countless pieces of ice and rock."
      },
      {
        question: "What is the name of NASA's famous space telescope launched in 1990?",
        answers: ["Kepler", "Hubble", "Chandra", "Spitzer"],
        correct: 1,
        fact: "The Hubble Space Telescope has transformed our view of the universe."
      },
      {
        question: "Which celestial body has the strongest surface gravity?",
        answers: ["The Moon", "Mars", "Earth", "Jupiter"],
        correct: 3,
        fact: "Jupiter's cloud-top gravity is about 2.5 times Earth's."
      },
      {
        question: "What do astronauts wear to protect themselves during a spacewalk?",
        answers: ["A pressure suit", "A thermal blanket", "A flight jacket", "A parachute suit"],
        correct: 0,
        fact: "A spacesuit provides oxygen, pressure, and temperature control."
      },
      {
        question: "About how long does sunlight take to reach Earth?",
        answers: ["8 seconds", "8 minutes", "80 minutes", "8 hours"],
        correct: 1,
        fact: "Light travels about 150 million kilometers from the Sun to Earth in 8 minutes."
      }
    ];

    const questionCount = document.querySelector("#question-count");
    const scoreDisplay = document.querySelector("#score");
    const questionTitle = document.querySelector("#question");
    const answersContainer = document.querySelector("#answers");
    const feedback = document.querySelector("#feedback");
    const nextButton = document.querySelector("#next-button");
    const progressBar = document.querySelector("#progress-bar");
    const progressTrack = document.querySelector(".progress-track");
    const quizView = document.querySelector("#quiz-view");
    const resultsView = document.querySelector("#results-view");
    let currentIndex = 0;
    let score = 0;
    let selectedIndex = null;
    let answered = false;
    let missionStartedAt = performance.now();

    function formatMissionDuration(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      const minuteLabel = minutes === 1 ? "minute" : "minutes";
      const secondLabel = seconds === 1 ? "second" : "seconds";
      return `${minutes} ${minuteLabel} ${String(seconds).padStart(2, "0")} ${secondLabel}`;
    }

    function renderQuestion() {
      const current = questions[currentIndex];
      questionCount.textContent = String(currentIndex + 1).padStart(2, "0");
      questionTitle.textContent = current.question;
      scoreDisplay.textContent = score;
      answersContainer.replaceChildren();
      feedback.textContent = "";
      feedback.className = "feedback";
      selectedIndex = null;
      answered = false;
      nextButton.disabled = true;
      nextButton.innerHTML = 'Check answer <span aria-hidden="true">→</span>';

      current.answers.forEach((answer, index) => {
        const button = document.createElement("button");
        button.className = "answer";
        button.type = "button";
        button.setAttribute("aria-pressed", "false");
        button.innerHTML = `<span class="answer-key">${String.fromCharCode(65 + index)}</span><span class="answer-text"></span>`;
        button.querySelector(".answer-text").textContent = answer;
        button.addEventListener("click", () => selectAnswer(index));
        answersContainer.append(button);
      });

      const progress = currentIndex + 1;
      progressBar.style.width = `${(progress / questions.length) * 100}%`;
      progressTrack.setAttribute("aria-valuenow", progress);
      questionTitle.focus({ preventScroll: true });
    }

    answersContainer.addEventListener("keydown", (event) => {
      if (!["ArrowDown", "ArrowRight", "ArrowUp", "ArrowLeft"].includes(event.key)) return;
      const answerButtons = [...answersContainer.children];
      const currentButtonIndex = answerButtons.indexOf(document.activeElement);
      if (currentButtonIndex === -1) return;

      event.preventDefault();
      const direction = event.key === "ArrowDown" || event.key === "ArrowRight" ? 1 : -1;
      const nextButtonIndex = (currentButtonIndex + direction + answerButtons.length) % answerButtons.length;
      answerButtons[nextButtonIndex].focus();
    });

    function selectAnswer(index) {
      if (answered) return;
      selectedIndex = index;
      [...answersContainer.children].forEach((button, buttonIndex) => {
        const isSelected = buttonIndex === index;
        button.classList.toggle("selected", isSelected);
        button.setAttribute("aria-pressed", String(isSelected));
      });
      nextButton.disabled = false;
    }

    function checkAnswer() {
      if (selectedIndex === null || answered) return;
      answered = true;
      const current = questions[currentIndex];
      const answerButtons = [...answersContainer.children];
      answerButtons.forEach((button) => { button.disabled = true; });
      answerButtons[current.correct].classList.add("correct");
      if (selectedIndex === current.correct) {
        score += 1;
        scoreDisplay.textContent = score;
        feedback.textContent = `Brilliant! ${current.fact}`;
        feedback.classList.add("is-correct");
      } else {
        answerButtons[selectedIndex].classList.add("wrong");
        feedback.textContent = `Not quite. ${current.fact}`;
        feedback.classList.add("is-wrong");
      }
      nextButton.innerHTML = currentIndex === questions.length - 1
        ? 'See results <span aria-hidden="true">→</span>'
        : 'Next question <span aria-hidden="true">→</span>';
    }

    function showResults() {
      const elapsedSeconds = Math.floor((performance.now() - missionStartedAt) / 1000);
      const missionDuration = formatMissionDuration(elapsedSeconds);
      const percentage = score / questions.length;
      const reaction = percentage === 1 ? "🏆" : percentage >= .7 ? "🚀" : percentage >= .4 ? "🌟" : "🪐";
      const headline = percentage === 1 ? "Out of this world!" : percentage >= .7 ? "Stellar work!" : percentage >= .4 ? "Nice exploring!" : "Keep reaching for the stars!";
      const message = percentage === 1
        ? "A perfect mission. You really know your way around the cosmos."
        : percentage >= .7
          ? "You navigated the universe like a pro. Ready for another orbit?"
          : percentage >= .4
            ? "Every great explorer learns along the way. Your next mission awaits."
            : "The universe is full of surprises. Take another trip and see what you discover.";
      quizView.hidden = true;
      resultsView.hidden = false;
      resultsView.className = "results";
      resultsView.innerHTML = `
        <div class="result-emoji" aria-hidden="true">${reaction}</div>
        <p class="eyebrow">Mission complete</p>
        <h1>${headline}</h1>
        <p class="results-copy">${message}</p>
        <p class="result-duration">Mission duration: <strong>${missionDuration}</strong></p>
        <div class="result-score">${score}<small>out of ${questions.length} correct</small></div>
        <div class="results-actions">
          <button class="primary" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
          <button class="secondary" id="copy-result-button" type="button">Copy result</button>
        </div>
        <p class="copy-status" id="copy-status" role="status" aria-live="polite"></p>
      `;
      document.querySelector("#restart-button").addEventListener("click", restartQuiz);
      document.querySelector("#copy-result-button").addEventListener("click", copyResult);
    }

    async function copyResult() {
      const copyStatus = document.querySelector("#copy-status");
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {
        copyStatus.textContent = "Could not copy your result. Clipboard access is unavailable.";
        return;
      }

      try {
        await navigator.clipboard.writeText(`I scored ${score} out of ${questions.length} on the Space Quiz!`);
        copyStatus.textContent = "Result copied to clipboard!";
      } catch {
        copyStatus.textContent = "Could not copy your result. Clipboard access was denied.";
      }
    }

    function restartQuiz() {
      currentIndex = 0;
      score = 0;
      missionStartedAt = performance.now();
      resultsView.hidden = true;
      quizView.hidden = false;
      renderQuestion();
    }

    nextButton.addEventListener("click", () => {
      if (!answered) {
        checkAnswer();
        return;
      }
      if (currentIndex === questions.length - 1) {
        progressBar.style.width = "100%";
        progressTrack.setAttribute("aria-valuenow", questions.length);
        showResults();
        return;
      }
      currentIndex += 1;
      renderQuestion();
    });

    renderQuestion();
  </script>
</body>
</html>
